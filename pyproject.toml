[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-video-ad-simulation-core"
version = "0.1.0"
description = "Public core components for AI video ad simulation"
readme = "README.md"
requires-python = ">=3.11"
license = "BUSL-1.1"

dependencies = [
    "ffmpeg-python>=0.2.0",
    "scenedetect>=0.6",
    "openai-whisper>=20231117",
    "easyocr>=1.7",
    "open-clip-torch>=2.24",
    "pydantic>=2.0",
    "jsonschema>=4.20",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src", "core"]
